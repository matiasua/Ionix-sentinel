  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tter-spacing: 0.02em;\">Sentinel<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #FF6B1A; background: rgba(255,107,26,0.14); padding: 4px 10px; border-radius: 999px;\">PCI-DSS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\">\n      <span style=\"color: rgba(245,241,237,0.40);\">{{ lastScanLabel }}<\u002Fspan>\n      <span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid #79BE96; border-radius: 999px; color: #79BE96; letter-spacing: 0.1em; font-size: 11px;\">\n        <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #79BE96; box-shadow: 0 0 10px #79BE96; animation: pulseDot 2.4s ease-in-out infinite;\"><\u002Fspan>\n        MOTOR ACTIVO\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width: 1240px; margin: 0 auto; padding: 24px 32px 72px;\">\n\n    <!-- Nav tabs -->\n    <nav style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 20px;\">\n      <button onclick=\"{{ goDashboard }}\" style=\"border: 1px solid {{ tabDashBorder }}; background: {{ tabDashBg }}; color: {{ tabDashColor }}; border-radius: 999px; padding: 9px 20px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\">Resumen<\u002Fbutton>\n      <button onclick=\"{{ goFindings }}\" style=\"display: inline-flex; align-items: center; gap: 8px; border: 1px solid {{ tabListBorder }}; background: {{ tabListBg }}; color: {{ tabListColor }}; border-radius: 999px; padding: 9px 20px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\">\n        Hallazgos\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(255,107,26,0.14); color: #FF8B4D; padding: 2px 8px; border-radius: 999px;\">{{ activeCount }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n\n    <!-- Scanning strip -->\n    <sc-if value=\"{{ scanning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background: #161313; border: 1px solid rgba(255,107,26,0.35); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px;\">\n          <span style=\"color: #FF8B4D;\">▸ {{ scanPhase }}<\u002Fspan>\n          <span style=\"color: rgba(245,241,237,0.66);\">{{ scanPct }}%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height: 4px; background: #261F1F; border-radius: 2px; overflow: hidden;\">\n          <div style=\"height: 100%; width: {{ scanPctW }}; background: #FF6B1A; border-radius: 2px; transition: width 0.15s ease;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ═══════ Error state ═══════ -->\n    <sc-if value=\"{{ isError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Estado Error\" style=\"display: flex; flex-direction: column; align-items: center; gap: 14px; background: #1F1B1B; border: 1px solid rgba(255,92,92,0.35); border-radius: 14px; padding: 64px 32px; margin-top: 24px; text-align: center;\">\n        <span style=\"width: 44px; height: 44px; border-radius: 50%; background: rgba(255,92,92,0.14); color: #FF7A76; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;\">!<\u002Fspan>\n        <h3 style=\"margin: 0; font-size: 19px; font-weight: 800;\">No se pudieron cargar los hallazgos<\u002Fh3>\n        <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #FF7A76; background: rgba(255,92,92,0.10); padding: 6px 14px; border-radius: 6px;\">GET /api/findings → 500 Internal Server Error<\u002Fcode>\n        <p style=\"margin: 0; max-width: 460px; color: rgba(245,241,237,0.66); font-size: 14.5px; line-height: 1.6;\">La API no respondió. Verifica que el backend esté corriendo (docker compose up) y reintenta.<\u002Fp>\n        <button onclick=\"{{ retry }}\" style=\"margin-top: 6px; background: #FF6B1A; color: #170B03; border: none; border-radius: 999px; padding: 11px 26px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 800; cursor: pointer;\">Reintentar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ═══════ Loading state ═══════ -->\n    <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Estado Loading\" style=\"display: flex; flex-direction: column; gap: 20px; margin-top: 8px;\">\n        <div style=\"display: grid; grid-template-columns: 360px 1fr; gap: 20px;\">\n          <div style=\"height: 280px; background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; animation: skel 1.4s ease-in-out infinite;\"><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; animation: skel 1.4s ease-in-out infinite;\"><\u002Fdiv>\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; animation: skel 1.4s ease-in-out infinite 0.15s;\"><\u002Fdiv>\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; animation: skel 1.4s ease-in-out infinite 0.3s;\"><\u002Fdiv>\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; animation: skel 1.4s ease-in-out infinite 0.45s;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height: 220px; background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; animation: skel 1.4s ease-in-out infinite 0.2s;\"><\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,237,0.40); text-align: center;\">Consultando API…<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showContent }}\" hint-placeholder-val=\"{{ true }}\">\n\n      <!-- ═══════ Vista A · Dashboard ═══════ -->\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"Vista A · Dashboard\">\n\n          <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <h1 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em;\">Resumen de cumplimiento<\u002Fh1>\n              <p style=\"margin: 0; color: rgba(245,241,237,0.66); font-size: 14.5px;\">Repositorio <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F5F1ED;\">payments-core<\u002Fspan> · rama main · {{ totalLabel }}<\u002Fp>\n            <\u002Fdiv>\n            <button onclick=\"{{ startScan }}\" disabled=\"{{ scanning }}\" style=\"display: inline-flex; align-items: center; gap: 10px; background: {{ scanBtnBg }}; color: #170B03; border: none; border-radius: 999px; padding: 12px 24px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14.5px; font-weight: 800; cursor: pointer;\">\n              <sc-if value=\"{{ scanning }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(23,11,3,0.3); border-top-color: #170B03; animation: spin 0.8s linear infinite;\"><\u002Fspan>\n                <span>Escaneando… {{ scanPct }}%<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notScanning }}\" hint-placeholder-val=\"{{ true }}\">\n                <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\"><circle cx=\"8\" cy=\"8\" r=\"6.5\" stroke=\"#170B03\" stroke-width=\"1.6\"><\u002Fcircle><path d=\"M8 8 L12 4.5\" stroke=\"#170B03\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"8\" cy=\"8\" r=\"1.6\" fill=\"#170B03\"><\u002Fcircle><\u002Fsvg>\n                <span>Escanear repo<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- Empty -->\n          <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div data-screen-label=\"Estado Empty\" style=\"display: flex; flex-direction: column; align-items: center; gap: 14px; background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 72px 32px; margin-top: 24px; text-align: center;\">\n              <svg width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" fill=\"none\">\n                <circle cx=\"36\" cy=\"36\" r=\"30\" stroke=\"rgba(255,255,255,0.09)\" stroke-width=\"1.5\"><\u002Fcircle>\n                <circle cx=\"36\" cy=\"36\" r=\"19\" stroke=\"rgba(255,255,255,0.14)\" stroke-width=\"1.5\"><\u002Fcircle>\n                <circle cx=\"36\" cy=\"36\" r=\"8\" stroke=\"rgba(255,107,26,0.5)\" stroke-width=\"1.5\"><\u002Fcircle>\n                <path d=\"M36 36 L56 22\" stroke=\"#FF6B1A\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n                <circle cx=\"36\" cy=\"36\" r=\"2.5\" fill=\"#FF6B1A\"><\u002Fcircle>\n              <\u002Fsvg>\n              <h3 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Aún no hay hallazgos<\u002Fh3>\n              <p style=\"margin: 0; max-width: 440px; color: rgba(245,241,237,0.66); font-size: 14.5px; line-height: 1.6;\">Ejecuta el primer escaneo del repositorio para detectar violaciones PCI-DSS en código y logs.<\u002Fp>\n              <button onclick=\"{{ startScan }}\" style=\"margin-top: 6px; display: inline-flex; align-items: center; gap: 10px; background: #FF6B1A; color: #170B03; border: none; border-radius: 999px; padding: 12px 26px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14.5px; font-weight: 800; cursor: pointer;\">Escanear repo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ notEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: grid; grid-template-columns: {{ dashCols }}; gap: 20px; margin-top: 24px;\">\n\n              <!-- RiskScoreGauge -->\n              <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 4px;\">\n                <span style=\"align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #FF6B1A; font-weight: 600;\">RISK SCORE AGREGADO<\u002Fspan>\n                <div style=\"position: relative; width: 240px; margin-top: 14px;\">\n                  <svg width=\"240\" height=\"140\" viewBox=\"0 0 200 118\">\n                    <path d=\"M 20 108 A 80 80 0 0 1 180 108\" stroke=\"#261F1F\" stroke-width=\"13\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n                    <path d=\"M 20 108 A 80 80 0 0 1 180 108\" stroke=\"{{ riskColor }}\" stroke-width=\"13\" fill=\"none\" stroke-linecap=\"round\" stroke-dasharray=\"{{ gaugeDash }}\" style=\"transition: stroke-dasharray 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);\"><\u002Fpath>\n                  <\u002Fsvg>\n                  <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 2px;\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 54px; font-weight: 700; line-height: 1; color: {{ riskColor }};\">{{ riskScore }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; font-weight: 600; color: {{ riskColor }}; background: {{ riskBg }}; padding: 6px 16px; border-radius: 999px;\">{{ riskLabel }}<\u002Fspan>\n                <span style=\"margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(245,241,237,0.40); text-align: center;\">10·crít + 5·alta + 2·media + 1·baja<br>sobre hallazgos activos<\u002Fspan>\n              <\u002Fdiv>\n\n              <!-- SeverityTiles -->\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n                <sc-for list=\"{{ sevTiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div onclick=\"{{ t.filterTo }}\" style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 18px 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; cursor: pointer;\" style-hover=\"border-color: rgba(255,255,255,0.22); background: #261F1F;\">\n                    <div style=\"display: flex; align-items: center; gap: 9px;\">\n                      <span style=\"width: 9px; height: 9px; border-radius: 50%; background: {{ t.dot }}; box-shadow: 0 0 10px {{ t.dot }};\"><\u002Fspan>\n                      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: rgba(245,241,237,0.66);\">{{ t.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 42px; font-weight: 700; line-height: 1; color: {{ t.numColor }};\">{{ t.count }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- Hallazgos recientes -->\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; margin-top: 20px; overflow: hidden;\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px;\">\n                <h2 style=\"margin: 0; font-size: 16px; font-weight: 800;\">Hallazgos recientes<\u002Fh2>\n                <button onclick=\"{{ goFindings }}\" style=\"background: none; border: none; color: #FF8B4D; font-family: 'Manrope', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 4px 0;\">Ver todos →<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column;\">\n                <sc-for list=\"{{ recent }}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <div onclick=\"{{ f.open }}\" style=\"display: grid; grid-template-columns: 96px 1fr 96px 132px; gap: 16px; align-items: center; padding: 13px 22px; border-top: 1px solid rgba(255,255,255,0.09); cursor: pointer;\" style-hover=\"background: #261F1F;\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; font-weight: 600; color: {{ f.sevColor }}; background: {{ f.sevBg }}; padding: 4px 0; border-radius: 6px; text-align: center;\">{{ f.sevLabel }}<\u002Fspan>\n                    <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0;\">\n                      <span style=\"font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ f.title }}<\u002Fspan>\n                      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,237,0.40); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ f.loc }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,237,0.66); text-align: center; background: #261F1F; border: 1px solid rgba(255,255,255,0.09); border-radius: 999px; padding: 3px 0;\">{{ f.reqLabel }}<\u002Fspan>\n                    <span style=\"display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{ f.statusColor }}; justify-self: end;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{ f.statusColor }};\"><\u002Fspan>{{ f.statusLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══════ Vista B · Lista de hallazgos ═══════ -->\n      <sc-if value=\"{{ isFindings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Vista B · Lista de hallazgos\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <h1 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em;\">Hallazgos<\u002Fh1>\n            <p style=\"margin: 0; color: rgba(245,241,237,0.66); font-size: 14.5px;\">{{ filteredLabel }}<\u002Fp>\n          <\u002Fdiv>\n\n          <!-- FilterBar -->\n          <div style=\"display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; background: #161313; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 16px 18px; margin-top: 20px;\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(245,241,237,0.40);\">SEVERIDAD<\u002Fspan>\n              <select value=\"{{ fSev }}\" onchange=\"{{ onSevFilter }}\" style=\"background: #261F1F; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer;\">\n                <option value=\"all\">Todas<\u002Foption>\n                <option value=\"critical\">Crítica<\u002Foption>\n                <option value=\"high\">Alta<\u002Foption>\n                <option value=\"medium\">Media<\u002Foption>\n                <option value=\"low\">Baja<\u002Foption>\n              <\u002Fselect>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(245,241,237,0.40);\">FUENTE<\u002Fspan>\n              <select value=\"{{ fSrc }}\" onchange=\"{{ onSrcFilter }}\" style=\"background: #261F1F; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer;\">\n                <option value=\"all\">Todas<\u002Foption>\n                <option value=\"code\">code<\u002Foption>\n                <option value=\"log\">log<\u002Foption>\n              <\u002Fselect>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(245,241,237,0.40);\">ESTADO<\u002Fspan>\n              <select value=\"{{ fSt }}\" onchange=\"{{ onStFilter }}\" style=\"background: #261F1F; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer;\">\n                <option value=\"all\">Todos<\u002Foption>\n                <option value=\"open\">Abierto<\u002Foption>\n                <option value=\"acknowledged\">Reconocido<\u002Foption>\n                <option value=\"resolved\">Resuelto<\u002Foption>\n                <option value=\"false_positive\">Falso positivo<\u002Foption>\n              <\u002Fselect>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(245,241,237,0.40);\">REQUISITO PCI-DSS<\u002Fspan>\n              <select value=\"{{ fReq }}\" onchange=\"{{ onReqFilter }}\" style=\"background: #261F1F; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer;\">\n                <option value=\"all\">Todos<\u002Foption>\n                <option value=\"2.2.5\">2.2.5<\u002Foption>\n                <option value=\"3.4\">3.4<\u002Foption>\n                <option value=\"3.5.1\">3.5.1<\u002Foption>\n                <option value=\"4.2.1\">4.2.1<\u002Foption>\n                <option value=\"6.3.3\">6.3.3<\u002Foption>\n                <option value=\"6.5.1\">6.5.1<\u002Foption>\n                <option value=\"6.5.5\">6.5.5<\u002Foption>\n                <option value=\"6.5.10\">6.5.10<\u002Foption>\n                <option value=\"8.2.3\">8.2.3<\u002Foption>\n                <option value=\"8.2.8\">8.2.8<\u002Foption>\n                <option value=\"10.6.1\">10.6.1<\u002Foption>\n              <\u002Fselect>\n            <\u002Flabel>\n            <sc-if value=\"{{ hasFilters }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ clearFilters }}\" style=\"background: none; border: 1px solid rgba(255,255,255,0.22); color: rgba(245,241,237,0.66); border-radius: 999px; padding: 8px 16px; font-family: 'Manrope', system-ui, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;\" style-hover=\"color: #F5F1ED; border-color: rgba(255,255,255,0.4);\">Limpiar filtros<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- Empty (sin escaneo) -->\n          <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px; background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 56px 32px; margin-top: 20px; text-align: center;\">\n              <h3 style=\"margin: 0; font-size: 17px; font-weight: 800;\">Aún no hay hallazgos<\u002Fh3>\n              <p style=\"margin: 0; color: rgba(245,241,237,0.66); font-size: 14px;\">Ejecuta un escaneo desde el resumen para poblar esta lista.<\u002Fp>\n              <button onclick=\"{{ startScan }}\" style=\"margin-top: 4px; background: #FF6B1A; color: #170B03; border: none; border-radius: 999px; padding: 11px 24px; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 800; cursor: pointer;\">Escanear repo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Sin resultados de filtro -->\n          <sc-if value=\"{{ noFilterResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px; background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 48px 32px; margin-top: 20px; text-align: center;\">\n              <p style=\"margin: 0; color: rgba(245,241,237,0.66); font-size: 14.5px;\">Ningún hallazgo coincide con los filtros actuales.<\u002Fp>\n              <button onclick=\"{{ clearFilters }}\" style=\"background: none; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 999px; padding: 9px 18px; font-family: 'Manrope', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;\">Limpiar filtros<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- FindingsTable (desktop) -->\n          <sc-if value=\"{{ showTable }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; margin-top: 20px; overflow: hidden;\">\n              <div style=\"display: grid; grid-template-columns: 96px 1fr 96px 280px 132px; gap: 16px; padding: 12px 22px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(245,241,237,0.40);\">\n                <span>SEVERIDAD<\u002Fspan><span>HALLAZGO<\u002Fspan><span style=\"text-align: center;\">REQ.<\u002Fspan><span>UBICACIÓN<\u002Fspan><span style=\"text-align: right;\">ESTADO<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ filtered }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <div onclick=\"{{ f.open }}\" style=\"display: grid; grid-template-columns: 96px 1fr 96px 280px 132px; gap: 16px; align-items: center; padding: 14px 22px; border-top: 1px solid rgba(255,255,255,0.09); cursor: pointer;\" style-hover=\"background: #261F1F;\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; font-weight: 600; color: {{ f.sevColor }}; background: {{ f.sevBg }}; padding: 4px 0; border-radius: 6px; text-align: center;\">{{ f.sevLabel }}<\u002Fspan>\n                  <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0;\">\n                    <span style=\"font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ f.title }}<\u002Fspan>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: rgba(245,241,237,0.40);\">{{ f.srcLabel }} · {{ f.ruleId }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,237,0.66); text-align: center; background: #261F1F; border: 1px solid rgba(255,255,255,0.09); border-radius: 999px; padding: 3px 0;\">{{ f.reqLabel }}<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,237,0.66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ f.loc }}<\u002Fspan>\n                  <span style=\"display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{ f.statusColor }}; justify-self: end;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{ f.statusColor }};\"><\u002Fspan>{{ f.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- FindingCards (angosto) -->\n          <sc-if value=\"{{ showCards }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 20px;\">\n              <sc-for list=\"{{ filtered }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div onclick=\"{{ f.open }}\" style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; cursor: pointer;\" style-hover=\"background: #261F1F;\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px;\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; font-weight: 600; color: {{ f.sevColor }}; background: {{ f.sevBg }}; padding: 4px 12px; border-radius: 6px;\">{{ f.sevLabel }}<\u002Fspan>\n                    <span style=\"display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{ f.statusColor }};\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{ f.statusColor }};\"><\u002Fspan>{{ f.statusLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size: 15px; font-weight: 700; line-height: 1.4;\">{{ f.title }}<\u002Fspan>\n                  <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: rgba(245,241,237,0.66);\">\n                    <span style=\"background: #261F1F; border: 1px solid rgba(255,255,255,0.09); border-radius: 999px; padding: 3px 10px;\">{{ f.reqLabel }}<\u002Fspan>\n                    <span>{{ f.loc }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══════ Vista C · Detalle ═══════ -->\n      <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Vista C · Detalle de hallazgo\" style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <button onclick=\"{{ goFindings }}\" style=\"align-self: flex-start; background: none; border: none; color: rgba(245,241,237,0.66); font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; padding: 2px 0;\" style-hover=\"color: #F5F1ED;\">← Volver a hallazgos<\u002Fbutton>\n\n          <!-- Encabezado -->\n          <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; font-weight: 600; color: {{ detail.sevColor }}; background: {{ detail.sevBg }}; padding: 5px 14px; border-radius: 6px;\">{{ detail.sevLabel }}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FF8B4D; background: rgba(255,107,26,0.14); border-radius: 999px; padding: 4px 12px;\">PCI-DSS {{ detail.pciRequirement }}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: rgba(245,241,237,0.66); background: #261F1F; border: 1px solid rgba(255,255,255,0.09); border-radius: 999px; padding: 4px 12px;\">{{ detail.srcLabel }}<\u002Fspan>\n              <span style=\"display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{ detail.statusColor }}; margin-left: auto;\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{ detail.statusColor }};\"><\u002Fspan>{{ detail.statusLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <h1 style=\"margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.3;\">{{ detail.title }}<\u002Fh1>\n            <div style=\"display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: rgba(245,241,237,0.66);\">\n              <span style=\"color: #F5F1ED;\">{{ detail.loc }}<\u002Fspan>\n              <span>{{ detail.ruleId }}<\u002Fspan>\n              <span>{{ detail.dateStr }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- CodeSnippet -->\n          <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; overflow: hidden;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.09); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(245,241,237,0.66);\">\n              <span>{{ detail.filePath }}<\u002Fspan>\n              <span style=\"color: #FF8B4D;\">{{ detail.lineLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background: #0B0A0A; padding: 10px 0; overflow-x: auto;\">\n              <sc-for list=\"{{ snippetLines }}\" as=\"ln\" hint-placeholder-count=\"6\">\n                <div style=\"display: grid; grid-template-columns: 64px 1fr; min-height: 22px; background: {{ ln.bg }}; border-left: 2px solid {{ ln.border }};\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 22px; color: {{ ln.numColor }}; text-align: right; padding-right: 18px; user-select: none;\">{{ ln.num }}<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 22px; color: {{ ln.textColor }}; white-space: pre; padding-right: 24px;\">{{ ln.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Análisis de Claude -->\n          <div style=\"display: grid; grid-template-columns: {{ claudeCols }}; gap: 20px;\">\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px;\">\n                <h3 style=\"margin: 0; font-size: 15.5px; font-weight: 800;\">Por qué es una violación<\u002Fh3>\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #F8B26A; background: rgba(248,178,106,0.12); border-radius: 999px; padding: 4px 12px; white-space: nowrap;\">✦ GENERADO POR CLAUDE<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: rgba(245,241,237,0.8);\">{{ detail.explanation }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #1F1B1B; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px;\">\n                <h3 style=\"margin: 0; font-size: 15.5px; font-weight: 800;\">Cómo corregirlo<\u002Fh3>\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #F8B26A; background: rgba(248,178,106,0.12); border-radius: 999px; padding: 4px 12px; white-space: nowrap;\">✦ GENERADO POR CLAUDE<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: rgba(245,241,237,0.8);\">{{ detail.remediation }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- StatusSelect -->\n          <div style=\"background: #161313; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;\">\n            <span style=\"font-size: 14px; font-weight: 700;\">Estado del hallazgo<\u002Fspan>\n            <select value=\"{{ detail.status }}\" onchange=\"{{ onStatusChange }}\" style=\"background: #261F1F; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 8px; padding: 9px 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer;\">\n              <option value=\"open\">Abierto<\u002Foption>\n              <option value=\"acknowledged\">Reconocido<\u002Foption>\n              <option value=\"resolved\">Resuelto<\u002Foption>\n              <option value=\"false_positive\">Falso positivo<\u002Foption>\n            <\u002Fselect>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-left: auto;\">\n              <button onclick=\"{{ ackDetail }}\" style=\"background: none; border: 1px solid rgba(255,255,255,0.22); color: #F5F1ED; border-radius: 999px; padding: 9px 18px; font-family: 'Manrope', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;\" style-hover=\"border-color: #E8C77A; color: #E8C77A;\">Marcar reconocido<\u002Fbutton>\n              <button onclick=\"{{ fpDetail }}\" style=\"background: none; border: 1px solid rgba(255,255,255,0.22); color: rgba(245,241,237,0.66); border-radius: 999px; padding: 9px 18px; font-family: 'Manrope', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;\" style-hover=\"border-color: rgba(255,255,255,0.4); color: #F5F1ED;\">Falso positivo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <!-- Toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: #261F1F; border: 1px solid #79BE96; border-radius: 999px; padding: 11px 22px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #79BE96; box-shadow: 0 16px 48px rgba(0,0,0,0.5); z-index: 50;\">\n      <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #79BE96; box-shadow: 0 0 10px #79BE96;\"><\u002Fspan>\n      {{ toast }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;uiState&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;normal&quot;, &quot;loading&quot;, &quot;empty&quot;, &quot;error&quot;],\n    &quot;default&quot;: &quot;normal&quot;,\n    &quot;tsType&quot;: &quot;\\&quot;normal\\&quot; | \\&quot;loading\\&quot; | \\&quot;empty\\&quot; | \\&quot;error\\&quot;&quot;,\n    &quot;section&quot;: &quot;Demo&quot;,\n    &quot;description&quot;: &quot;Fuerza un estado de UI para la demo&quot;\n  },\n  &quot;vistaInicial&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;dashboard&quot;, &quot;findings&quot;],\n    &quot;default&quot;: &quot;dashboard&quot;,\n    &quot;tsType&quot;: &quot;\\&quot;dashboard\\&quot; | \\&quot;findings\\&quot;&quot;,\n    &quot;section&quot;: &quot;Demo&quot;,\n    &quot;description&quot;: &quot;Vista mostrada al cargar&quot;\n  }\n}\">\nconst SEV_META = {\n  critical: { label: \"CRÍTICA\", color: \"#FF8A85\", num: \"#FF7A76\", bg: \"rgba(255,92,92,0.14)\", dot: \"#FF5C5C\", tile: \"CRÍTICOS\", rank: 3 },\n  high:     { label: \"ALTA\",    color: \"#FF9B61\", num: \"#FF8B4D\", bg: \"rgba(255,107,26,0.14)\", dot: \"#FF6B1A\", tile: \"ALTOS\", rank: 2 },\n  medium:   { label: \"MEDIA\",   color: \"#E8C77A\", num: \"#E8C77A\", bg: \"rgba(232,199,122,0.14)\", dot: \"#E8C77A\", tile: \"MEDIOS\", rank: 1 },\n  low:      { label: \"BAJA\",    color: \"#B7C2CB\", num: \"#B7C2CB\", bg: \"rgba(183,194,203,0.14)\", dot: \"#B7C2CB\", tile: \"BAJOS\", rank: 0 }\n};\nconst STATUS_META = {\n  open:           { label: \"Abierto\",        color: \"#FF8B4D\" },\n  acknowledged:   { label: \"Reconocido\",     color: \"#E8C77A\" },\n  resolved:       { label: \"Resuelto\",       color: \"#79BE96\" },\n  false_positive: { label: \"Falso positivo\", color: \"rgba(245,241,237,0.40)\" }\n};\nconst SCAN_PHASES = [\n  [0,  \"Clonando repositorio payments-core…\"],\n  [25, \"Analizando código fuente (247 archivos)…\"],\n  [55, \"Analizando logs de aplicación…\"],\n  [72, \"Mapeando hallazgos a requisitos PCI-DSS…\"],\n  [86, \"Generando explicaciones y remediaciones con Claude…\"]\n];\nconst ARC = 251.33; // longitud del semicírculo r=80\n\nclass Component extends DCLogic {\n  state = {\n    view: \"dashboard\",\n    selectedId: null,\n    findings: null,\n    scanning: false,\n    scanPct: 0,\n    scanPhase: \"\",\n    fSev: \"all\", fSrc: \"all\", fSt: \"all\", fReq: \"all\",\n    narrow: false,\n    uiOverride: null,\n    toast: null,\n    loadError: false\n  };\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ narrow: window.innerWidth < 920 });\n    window.addEventListener(\"resize\", this._onResize);\n    this._onResize();\n    if (this.props.vistaInicial && this.props.vistaInicial !== \"dashboard\") {\n      this.setState({ view: this.props.vistaInicial });\n    }\n    this.loadData();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this._onResize);\n    clearInterval(this._scanTimer);\n    clearTimeout(this._toastTimer);\n  }\n\n  componentDidUpdate(prevProps) {\n    if (prevProps.uiState !== this.props.uiState && this._mock) {\n      const ui = this.props.uiState || \"normal\";\n      this.setState({\n        uiOverride: null,\n        loadError: false,\n        findings: ui === \"empty\" ? [] : this._mock.findings.map(f => ({ ...f }))\n      });\n    }\n    if (prevProps.vistaInicial !== this.props.vistaInicial && this.props.vistaInicial) {\n      this.setState({ view: this.props.vistaInicial });\n    }\n  }\n\n  effectiveUi() {\n    return this.state.uiOverride ?? (this.props.uiState || \"normal\");\n  }\n\n  async loadData() {\n    // Espera a que el script de datos (inline o externo) esté disponible\n    let mod = window.__SENTINEL_MOCK;\n    for (let i = 0; i < 40 && !mod; i++) {\n      await new Promise(r => setTimeout(r, 25));\n      mod = window.__SENTINEL_MOCK;\n    }\n    try {\n      if (!mod) throw new Error(\"mock no disponible\");\n      this._mock = mod;\n      const ui = this.effectiveUi();\n      setTimeout(() => {\n        this.setState({ findings: ui === \"empty\" ? [] : mod.findings.map(f => ({ ...f })) });\n      }, 400);\n    } catch (e) {\n      console.error(\"Error cargando mock-findings.js\", e);\n      this.setState({ loadError: true });\n    }\n  }\n\n  startScan() {\n    if (this.state.scanning || !this._mock) return;\n    this.setState({ scanning: true, scanPct: 0, scanPhase: SCAN_PHASES[0][1], uiOverride: \"normal\" });\n    this._scanTimer = setInterval(() => {\n      const pct = Math.min(100, this.state.scanPct + 1.5 + Math.random() * 3.5);\n      const phase = SCAN_PHASES.filter(p => pct >= p[0]).pop()[1];\n      if (pct >= 100) {\n        clearInterval(this._scanTimer);\n        const fresh = this._mock.findings.map(f => ({ ...f }));\n        this.setState({ scanning: false, scanPct: 0, findings: fresh });\n        this.showToast(\"Escaneo completado · \" + fresh.length + \" hallazgos detectados\");\n      } else {\n        this.setState({ scanPct: Math.round(pct), scanPhase: phase });\n      }\n    }, 110);\n  }\n\n  showToast(msg) {\n    clearTimeout(this._toastTimer);\n    this.setState({ toast: msg });\n    this._toastTimer = setTimeout(() => this.setState({ toast: null }), 4200);\n  }\n\n  changeStatus(id, status) {\n    this.setState({\n      findings: this.state.findings.map(f => (f.id === id ? { ...f, status } : f))\n    });\n    this.showToast(\"Estado actualizado → \" + STATUS_META[status].label);\n  }\n\n  decorate(f) {\n    const sev = SEV_META[f.severity];\n    const st = STATUS_META[f.status];\n    const d = new Date(f.createdAt);\n    return {\n      ...f,\n      sevLabel: sev.label, sevColor: sev.color, sevBg: sev.bg,\n      statusLabel: st.label, statusColor: st.color,\n      reqLabel: \"PCI \" + f.pciRequirement,\n      srcLabel: f.source === \"code\" ? \"CÓDIGO\" : \"LOG\",\n      loc: f.lineNumber != null ? f.filePath + \":\" + f.lineNumber : f.filePath,\n      lineLabel: f.lineNumber != null ? \"línea \" + f.lineNumber : \"archivo completo\",\n      dateStr: d.toLocaleDateString(\"es-CL\", { day: \"2-digit\", month: \"short\", year: \"numeric\" }) + \" \" +\n               d.toLocaleTimeString(\"es-CL\", { hour: \"2-digit\", minute: \"2-digit\" }) + \" UTC\",\n      open: () => this.setState({ view: \"detail\", selectedId: f.id })\n    };\n  }\n\n  sortFindings(list) {\n    return [...list].sort((a, b) =>\n      SEV_META[b.severity].rank - SEV_META[a.severity].rank ||\n      b.createdAt.localeCompare(a.createdAt)\n    );\n  }\n\n  renderVals() {\n    const s = this.state;\n    const ui = this.effectiveUi();\n    const isError = ui === \"error\" || s.loadError;\n    const isLoading = !isError && (ui === \"loading\" || s.findings === null);\n    const showContent = !isError && !isLoading;\n    const list = s.findings || [];\n\n    // Riesgo agregado sobre hallazgos activos (open + acknowledged)\n    const active = list.filter(f => f.status === \"open\" || f.status === \"acknowledged\");\n    const counts = { critical: 0, high: 0, medium: 0, low: 0 };\n    active.forEach(f => counts[f.severity]++);\n    const riskScore = 10 * counts.critical + 5 * counts.high + 2 * counts.medium + 1 * counts.low;\n    const level = riskScore === 0\n      ? { color: \"#79BE96\", bg: \"rgba(121,190,150,0.14)\", label: \"SIN RIESGO\" }\n      : riskScore < 10\n        ? { color: \"#E8C77A\", bg: \"rgba(232,199,122,0.14)\", label: \"RIESGO MODERADO\" }\n        : { color: \"#FF7A76\", bg: \"rgba(255,92,92,0.14)\", label: \"RIESGO ALTO\" };\n    const gaugePct = Math.min(riskScore / 50, 1);\n\n    const sevTiles = [\"critical\", \"high\", \"medium\", \"low\"].map(key => ({\n      key,\n      label: SEV_META[key].tile,\n      count: counts[key],\n      dot: SEV_META[key].dot,\n      numColor: counts[key] > 0 ? SEV_META[key].num : \"rgba(245,241,237,0.25)\",\n      filterTo: () => this.setState({ view: \"findings\", fSev: key, fSrc: \"all\", fSt: \"all\", fReq: \"all\" })\n    }));\n\n    const sorted = this.sortFindings(list).map(f => this.decorate(f));\n    const filtered = sorted.filter(f =>\n      (s.fSev === \"all\" || f.severity === s.fSev) &&\n      (s.fSrc === \"all\" || f.source === s.fSrc) &&\n      (s.fSt === \"all\" || f.status === s.fSt) &&\n      (s.fReq === \"all\" || f.pciRequirement === s.fReq)\n    );\n    const hasFilters = s.fSev !== \"all\" || s.fSrc !== \"all\" || s.fSt !== \"all\" || s.fReq !== \"all\";\n\n    // Detalle\n    let detail = null, snippetLines = [];\n    if (s.view === \"detail\" && s.selectedId) {\n      const raw = list.find(f => f.id === s.selectedId);\n      if (raw) {\n        detail = this.decorate(raw);\n        const start = (this._mock && this._mock.snippetStart[raw.id]) || 1;\n        snippetLines = raw.snippet.split(\"\\n\").map((text, i) => {\n          const num = start + i;\n          const hot = raw.lineNumber != null && num === raw.lineNumber;\n          return {\n            num, text: text === \"\" ? \" \" : text,\n            bg: hot ? \"rgba(255,107,26,0.10)\" : \"transparent\",\n            border: hot ? \"#FF6B1A\" : \"transparent\",\n            numColor: hot ? \"#FF8B4D\" : \"rgba(245,241,237,0.30)\",\n            textColor: hot ? \"#F5F1ED\" : \"rgba(245,241,237,0.75)\"\n          };\n        });\n      }\n    }\n\n    const isDetail = s.view === \"detail\" && !!detail;\n    const isFindings = s.view === \"findings\" || (s.view === \"detail\" && !detail);\n    const isDashboard = s.view === \"dashboard\";\n    const isEmpty = list.length === 0;\n\n    const tabDash = isDashboard;\n    const tabList = !isDashboard;\n\n    const setFilter = key => e => this.setState({ [key]: e.target.value });\n\n    return {\n      // navegación\n      isDashboard, isFindings, isDetail, isError, isLoading, showContent,\n      goDashboard: () => this.setState({ view: \"dashboard\" }),\n      goFindings: () => this.setState({ view: \"findings\" }),\n      tabDashBg: tabDash ? \"rgba(255,107,26,0.14)\" : \"transparent\",\n      tabDashColor: tabDash ? \"#FF8B4D\" : \"rgba(245,241,237,0.66)\",\n      tabDashBorder: tabDash ? \"rgba(255,107,26,0.4)\" : \"rgba(255,255,255,0.22)\",\n      tabListBg: tabList ? \"rgba(255,107,26,0.14)\" : \"transparent\",\n      tabListColor: tabList ? \"#FF8B4D\" : \"rgba(245,241,237,0.66)\",\n      tabListBorder: tabList ? \"rgba(255,107,26,0.4)\" : \"rgba(255,255,255,0.22)\",\n\n      // header\n      lastScanLabel: list.length ? \"Último escaneo · 02 JUL 2026 09:14 UTC\" : \"Sin escaneos registrados\",\n      activeCount: active.length,\n\n      // riesgo\n      riskScore,\n      riskColor: level.color,\n      riskBg: level.bg,\n      riskLabel: level.label,\n      gaugeDash: (gaugePct * ARC).toFixed(1) + \" 400\",\n      sevTiles,\n      totalLabel: list.length + \" hallazgos · \" + active.length + \" activos\",\n\n      // dashboard\n      isEmpty, notEmpty: !isEmpty,\n      dashCols: s.narrow ? \"1fr\" : \"360px 1fr\",\n      recent: sorted.slice(0, 8),\n\n      // escaneo\n      scanning: s.scanning,\n      notScanning: !s.scanning,\n      scanPct: s.scanPct,\n      scanPctW: s.scanPct + \"%\",\n      scanPhase: s.scanPhase,\n      scanBtnBg: s.scanning ? \"#C24700\" : \"#FF6B1A\",\n      startScan: () => this.startScan(),\n\n      // filtros / lista\n      fSev: s.fSev, fSrc: s.fSrc, fSt: s.fSt, fReq: s.fReq,\n      onSevFilter: setFilter(\"fSev\"),\n      onSrcFilter: setFilter(\"fSrc\"),\n      onStFilter: setFilter(\"fSt\"),\n      onReqFilter: setFilter(\"fReq\"),\n      clearFilters: () => this.setState({ fSev: \"all\", fSrc: \"all\", fSt: \"all\", fReq: \"all\" }),\n      hasFilters,\n      filtered,\n      filteredLabel: filtered.length + \" de \" + list.length + \" hallazgos · ordenados por severidad\",\n      noFilterResults: !isEmpty && filtered.length === 0,\n      showTable: !isEmpty && filtered.length > 0 && !s.narrow,\n      showCards: !isEmpty && filtered.length > 0 && s.narrow,\n\n      // detalle\n      detail: detail || {},\n      snippetLines,\n      claudeCols: s.narrow ? \"1fr\" : \"1fr 1fr\",\n      onStatusChange: e => detail && this.changeStatus(detail.id, e.target.value),\n      ackDetail: () => detail && this.changeStatus(detail.id, \"acknowledged\"),\n      fpDetail: () => detail && this.changeStatus(detail.id, \"false_positive\"),\n\n      // misc\n      retry: () => {\n        this.setState({ uiOverride: \"normal\", loadError: false });\n        if (!this.state.findings && this._mock) {\n          this.setState({ findings: this._mock.findings.map(f => ({ ...f })) });\n        }\n      },\n      toast: s.toast\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
