<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dependencias entre tareas del EDT de IONIX Sentinel (actualizado)</title>
<desc>Diagrama de flujo actualizado: el frontend ya está construido, el PM se suma a ayudar con las reglas del Developer, y todo converge en la integración backend y el swap del scan simulado por el real.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
</defs>

<style>
  .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .boxCrit { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
  .boxDone { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
  .title { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
  .sub { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
  .laneLabel { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.04em; }
  .edge { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .edgeCrit { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowAccent); }
</style>

<rect width="1040" height="700" fill="#ffffff"/>

<!-- Kickoff -->
<rect x="20" y="16" width="1000" height="46" rx="10" class="boxCrit"/>
<text x="520" y="36" text-anchor="middle" class="title">Bloque 0 — Kickoff (10 min)</text>
<text x="520" y="52" text-anchor="middle" class="sub">Confirmar rol reasignado del PM · worktree repo demo · env vars</text>

<!-- Frontend ya hecho -->
<rect x="810" y="80" width="210" height="70" rx="10" class="boxDone"/>
