services:
  postgres:
    image: postgres:16-alpine
    container_name: ionix-sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ionix_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ionix_postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-ionix_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ionix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ionix-sentinel-backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel_user:sentinel_password@postgres:5432/ionix_sentinel}
      # Ruta FIJA dentro del contenedor (no la del host) — el path real del
      # host se controla con SCAN_TARGET_HOST_PATH en .env, ver volumes abajo.
      # POST /api/scan usa esto solo si el body no manda { path }.
      SCAN_TARGET_PATH: /app/scan-target
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - backend_node_modules:/app/node_modules
      # Checkout local de pci-dss-vulnerable-demo (rama pci-vulnerable-demo),
      # montado de solo lectura para que el Analizador Estático (T1.1-T1.5)
      # pueda leerlo desde dentro del contenedor. Cada quien configura dónde
      # lo tiene en su máquina vía SCAN_TARGET_HOST_PATH en su .env — el
      # default asume que vive como carpeta hermana de este repo (ver HU-B1.1
      # en docs/epicas-historias.md).
      - ${SCAN_TARGET_HOST_PATH:-../pci-dss-vulnerable-demo}:/app/scan-target:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ionix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ionix-sentinel-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ionix-network

networks:
  ionix-network:
    driver: bridge

volumes:
  ionix_postgres_data:
    name: ionix_postgres_data
  backend_node_modules:
  frontend_node_modules:
